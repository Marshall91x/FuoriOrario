<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fuori Orario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app a colonna singola per telefono, barra delle schede in basso, mezzo campo FIBA come elemento centrale */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f5f6f8; --ink:#141a22; --muted:#5b6571; --line:#d3d9e0;
  --accent:#d9531a; --accent-ink:#ffffff; --accent-soft:#fbe3d7;
  --court:#ead6b6; --court-line:#7b4f25;
  --hot:#d9531a; --even:#c7ad83; --cold:#3569b8; --none:#d9cdb9;
  --good:#2c8a57;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#171c23; --surface-2:#1e242c; --ink:#e7eaee; --muted:#9aa3ae; --line:#2b323c;
  --accent:#ff7a3d; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --court:#33291f; --court-line:#d8b88a;
  --hot:#ff7a3d; --even:#7a6a52; --cold:#5c9cf2; --none:#4a3f32;
  --good:#4cc283; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#171c23; --surface-2:#1e242c; --ink:#e7eaee; --muted:#9aa3ae; --line:#2b323c;
  --accent:#ff7a3d; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --court:#33291f; --court-line:#d8b88a;
  --hot:#ff7a3d; --even:#7a6a52; --cold:#5c9cf2; --none:#4a3f32;
  --good:#4cc283; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:560px;width:100%;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:18px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:26px;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--accent)}
.who{display:flex;gap:8px;align-items:center}
.who select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600}
.role-toggle{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.role-toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}

/* sections */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13.5px}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--muted);font-weight:600}
@media (max-width:400px){.stats{grid-template-columns:repeat(2,1fr);row-gap:14px}}

/* court */
.court{width:100%;height:auto;display:block;border-radius:10px;touch-action:manipulation}
.court .bg{fill:var(--court)}
.court .zone{stroke:var(--court-line);stroke-width:1;stroke-opacity:.25;cursor:pointer;transition:fill-opacity .15s}
.court .zone:hover{fill-opacity:.95}
.z-hot{fill:var(--hot);fill-opacity:.78}
.z-even{fill:var(--even);fill-opacity:.7}
.z-cold{fill:var(--cold);fill-opacity:.7}
.z-none{fill:var(--none);fill-opacity:.55}
.court .sel{stroke:var(--ink);stroke-width:3;stroke-opacity:1}
.court .lines *{fill:none;stroke:var(--court-line);stroke-width:2.5;pointer-events:none}
.court text{font-family:var(--f-display);fill:var(--ink);pointer-events:none;text-anchor:middle;font-variant-numeric:tabular-nums}
.court .pct{font-size:24px;font-weight:700}
.court .ma{font-size:14px;font-weight:600;fill-opacity:.75}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.zone-detail{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:10px;padding:10px 14px;cursor:pointer;border:0;width:100%;text-align:left}
.ft .num{font-size:26px;font-weight:700}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .l-all{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .a-all{fill:var(--accent);fill-opacity:.12;stroke:none}
.chart .l-ft{fill:none;stroke:var(--cold);stroke-width:2;stroke-dasharray:5 4}
.chart .d-all{fill:var(--accent)}
.chart .d-ft{fill:var(--cold)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding-block:11px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .date{font-family:var(--f-display);font-weight:600;font-size:16px;width:58px;flex:none;line-height:1.1}
.item .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* plan */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.weeknav .wk{font-family:var(--f-display);font-weight:600;font-size:19px;text-align:center}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.coach-note{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:14.5px;white-space:pre-wrap}
.ex{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:4px}
.ex .head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.chip{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ex .target{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--accent)}
.ex .detail{font-size:14px;color:var(--muted);margin:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.dot{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--accent-ink)}
.dot.on{border-color:var(--accent)}
.dot.done{background:var(--accent);border-color:var(--accent)}
.dot.off{border-style:dashed;opacity:.35;cursor:default}
.day.today{color:var(--ink)}
.day.today .dot.on:not(.done){box-shadow:0 0 0 3px var(--accent-soft)}

/* team table */
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:right;font-weight:600;padding:6px 6px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-family:var(--f-body);font-size:14.5px;font-weight:600;white-space:normal}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.pill{display:inline-block;min-width:44px;text-align:center;border-radius:999px;padding:1px 8px;font-size:15px}
.p-good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.p-mid{background:var(--accent-soft);color:var(--accent)}
.p-low{background:var(--surface-2);color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.zrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.zrow .zn{font-weight:600;font-size:14px;min-width:0}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;line-height:1}
.step input{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;background:var(--surface);font-family:var(--f-display);font-size:18px;font-weight:600}
.step .cap{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.lib{display:flex;gap:6px;flex-wrap:wrap}
.lib button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px}
.err{color:var(--accent);font-size:13.5px}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabbar button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{text-align:center;padding-block:26px;display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Fuori <span>Orario</span></h1><span class="label" id="sub">Lavoro individuale</span></div>
    <div class="who">
      <select id="pick" aria-label="Giocatore"></select>
      <button class="role-toggle" id="roleBtn" hidden aria-pressed="false">Vista giocatore</button>
    </div>
    <div class="banner" id="banner" hidden></div>
  </header>
  <main id="main" class="wrap"></main>
</div>

<nav class="tabbar" aria-label="Sezioni"><div class="in" id="tabs"></div></nav>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(() => {
// ---------- costanti ----------
const ZONES = [
  {id:'pit', name:'Pitturato', ref:.55, lx:250, ly:100},
  {id:'mls', name:'Media sinistra', ref:.40, lx:100, ly:115},
  {id:'mlc', name:'Media centrale', ref:.40, lx:250, ly:232},
  {id:'mld', name:'Media destra', ref:.40, lx:400, ly:115},
  {id:'acs', name:'Tripla angolo sx', ref:.36, lx:17, ly:42, small:true, three:true},
  {id:'als', name:'Tripla ala sx', ref:.33, lx:52, ly:330, three:true},
  {id:'cen', name:'Tripla centrale', ref:.33, lx:250, ly:350, three:true},
  {id:'ald', name:'Tripla ala dx', ref:.33, lx:448, ly:330, three:true},
  {id:'acd', name:'Tripla angolo dx', ref:.36, lx:483, ly:42, small:true, three:true},
  {id:'tl',  name:'Tiri liberi', ref:.70}
];
const ZMAP = Object.fromEntries(ZONES.map(z=>[z.id,z]));
const DAYS = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const CATS = ['Ball handling','Tiro','Footwork','Atletica','Difesa','Recupero'];
const ROLES = ['Playmaker','Guardia','Ala','Ala grande','Centro'];
const LIB = [
  {title:'Palleggio a due palloni', cat:'Ball handling', target:'3 × 60"', detail:'Stessa altezza, poi alternati, poi uno alto e uno basso. Sguardo avanti, mai sulla palla.'},
  {title:'Mano debole: arresto e tiro', cat:'Tiro', target:'5 × 10 tiri', detail:'Due palleggi con la mano debole, arresto a un tempo, tiro dalla media. Conta i canestri.'},
  {title:'Form shooting sotto canestro', cat:'Tiro', target:'50 tiri', detail:'Una mano sola, a 1-2 metri. Gomito sotto la palla, chiusura del polso, tieni la posa.'},
  {title:'Tiri liberi sotto fatica', cat:'Tiro', target:'10 serie da 2', detail:'Uno sprint campo e ritorno, poi 2 liberi. Stessa routine ogni volta.'},
  {title:'Mikan drill', cat:'Footwork', target:'3 × 20 canestri', detail:'Destra-sinistra senza far toccare terra alla palla. Piedi rapidi, palla alta.'},
  {title:'Perno e ribaltamento', cat:'Footwork', target:'4 × 8 per lato', detail:'Ricezione in post, perno frontale e dorsale, finta e partenza. Piede perno incollato.'},
  {title:'Pliometria leggera', cat:'Atletica', target:'3 × 8 salti', detail:'Salti sulla panca, balzi laterali, atterraggio morbido. Mai a ginocchia in dentro.'},
  {title:'Core stability', cat:'Atletica', target:'3 giri', detail:'Plank 40", side plank 30" per lato, dead bug 12 ripetizioni.'},
  {title:'Scivolamenti difensivi', cat:'Difesa', target:'6 × 20"', detail:'Posizione bassa, piedi non si incrociano, mani attive. Recupero 40".'},
  {title:'Mobilità e allungamento', cat:'Recupero', target:'15 minuti', detail:'Anche, caviglie, schiena. Da fare dopo le partite e nei giorni liberi.'}
];

// ---------- utilità ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const monday = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fmtShort = s => { const d = parseYmd(s); return `${d.getDate()} ${MESI[d.getMonth()]}`; };
const pct = (m,a) => a ? Math.round(m/a*100) : null;
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };

// ---------- stato ----------
const S = {
  ready:false, demo:false, staff:false, asPlayer:false, readOnly:false, uid:null,
  players:{}, shots:{}, plans:{}, checks:{},
  pid: lsGet('fo.pid'), tab: (location.hash||'').replace('#','') || lsGet('fo.tab') || 'tiro',
  period: 30, week: ymd(monday(new Date())), zoneSel:null, confirmDel:null
};
if (!['tiro','piano','squadra'].includes(S.tab)) S.tab = 'tiro';
let db = null;
const isStaff = () => S.staff && !S.asPlayer;

// ---------- scritture ----------
async function put(coll, id, data){
  if (S.demo || !db){ S[coll] = {...S[coll], [id]: data}; render(); return true; }
  try { await db.collection(coll).doc(id).set(data); return true; }
  catch(e){ failWrite(e); return false; }
}
async function del(coll, id){
  if (S.demo || !db){ const c = {...S[coll]}; delete c[id]; S[coll] = c; render(); return; }
  try { await db.collection(coll).doc(id).delete(); } catch(e){ failWrite(e); }
}
function failWrite(e){
  if (e && e.code === 'invalid_argument'){ S.readOnly = true; render(); toast('Non hai i permessi per salvare. Chiedi allo staff di invitarti come editor.'); }
  else if (e && e.code === 'quota_exceeded') toast('Spazio dati esaurito: elimina qualche sessione vecchia.');
  else toast('Salvataggio non riuscito. Riprova tra poco.');
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg;
  $('#toastHost').replaceChildren(t); setTimeout(()=>t.remove(), 3200);
}

// ---------- calcoli ----------
const playersSorted = () => Object.entries(S.players).map(([id,p])=>({id,...p})).sort((a,b)=>(a.num??99)-(b.num??99) || a.name.localeCompare(b.name));
function sessionsFor(pid, days){
  const from = days ? ymd(addDays(new Date(), -days+1)) : '0000';
  return Object.entries(S.shots).map(([id,s])=>({id,...s})).filter(s=>s.pid===pid && s.date>=from).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
}
function sumZones(list){
  const t = {}; ZONES.forEach(z=>t[z.id]=[0,0]);
  list.forEach(s=>{ for (const [k,v] of Object.entries(s.z||{})) if (t[k]){ t[k][0]+=+v[0]||0; t[k][1]+=+v[1]||0; } });
  return t;
}
function totals(t, filter){
  let m=0,a=0; for (const z of ZONES) if (filter(z)){ m+=t[z.id][0]; a+=t[z.id][1]; } return [m,a];
}
const fieldF = z => z.id!=='tl';
function zoneClass(z, ma){
  if (!ma[1]) return 'z-none';
  const r = ma[0]/ma[1]/z.ref;
  return r >= 1.1 ? 'z-hot' : r < 0.85 ? 'z-cold' : 'z-even';
}
function planFor(pid){ return S.plans[pid] || {items:[], note:''}; }
function checksFor(pid, week){ return (S.checks[`${pid}_${week}`]||{}).done || {}; }
function weekProgress(pid, week){
  const items = planFor(pid).items||[]; const done = checksFor(pid, week);
  let tot=0, ok=0; items.forEach(it=>(it.days||[]).forEach(d=>{ tot++; if (done[`${it.id}:${d}`]) ok++; }));
  return {tot, ok};
}

// ---------- render ----------
function render(){
  renderHeader(); renderTabs();
  const m = $('#main');
  if (!S.ready){ m.innerHTML = `<section class="panel empty"><h3>Collegamento in corso…</h3><p class="muted">Sto caricando la rosa e i dati della squadra.</p></section>`; return; }
  const players = playersSorted();
  if (!players.length){ m.innerHTML = emptyRoster(); bindMain(); return; }
  if (!S.players[S.pid]) S.pid = players[0].id;
  if (S.tab==='squadra' && !isStaff()) S.tab='tiro';
  m.innerHTML = S.tab==='tiro' ? viewTiro() : S.tab==='piano' ? viewPiano() : viewSquadra();
  bindMain();
}
function renderHeader(){
  const sel = $('#pick'); const players = playersSorted();

// ---------- vista: diario di tiro ----------
function viewTiro(){
  const p = S.players[S.pid];
  const list = sessionsFor(S.pid, S.period);
  const t = sumZones(list);
  const [fm, fa] = totals(t, fieldF), [tm, ta] = totals(t, z=>z.three), ft = t.tl;
  const fmtP = (m,a) => a ? `${pct(m,a)}<small>%</small>` : '<small>—</small>';
  const canLog = !S.readOnly;
  const sel = S.zoneSel ? ZMAP[S.zoneSel] : null;
  return `
  <section class="panel">
    <div class="row between">
      <div><div class="label">${esc(p.role||'Giocatore')}${p.num!=null&&p.num!==''?' · #'+esc(p.num):''}</div><h2>${esc(p.name)}</h2></div>
      <button class="btn" data-act="log" ${canLog?'':'disabled'}>+ Registra sessione</button>
    </div>
    <div class="seg" role="group" aria-label="Periodo">
      ${[[7,'7 giorni'],[30,'30 giorni'],[0,'Stagione']].map(([v,l])=>`<button data-period="${v}" aria-pressed="${S.period===v}">${l}</button>`).join('')}
    </div>
    <div class="stats">
      <div class="stat"><span class="label">Tiri presi</span><span class="v">${fa+ft[1]}</span></div>
      <div class="stat"><span class="label">Dal campo</span><span class="v">${fmtP(fm,fa)}</span></div>
      <div class="stat"><span class="label">Da tre</span><span class="v">${fmtP(tm,ta)}</span></div>
      <div class="stat"><span class="label">Liberi</span><span class="v">${fmtP(ft[0],ft[1])}</span></div>
    </div>
  </section>

  <section class="panel">
    <div class="row between"><h3>Mappa di tiro</h3><span class="label">Tocca una zona</span></div>
    ${courtSvg(t)}
    <button class="ft ${zoneClass(ZMAP.tl, ft)}" data-zone="tl" style="color:var(--ink)">
      <span><span class="label" style="color:inherit">Linea del tiro libero</span><br>${ft[1]?`${ft[0]}/${ft[1]}`:'Nessun tiro registrato'}</span>
      <span class="num">${ft[1]?pct(ft[0],ft[1])+'%':'—'}</span>
    </button>
    ${sel ? `<div class="zone-detail" aria-live="polite"><strong>${esc(sel.name)}</strong>: ${t[sel.id][1]?`${t[sel.id][0]} su ${t[sel.id][1]} · <strong>${pct(...t[sel.id])}%</strong>`:'nessun tiro nel periodo'} · riferimento ${Math.round(sel.ref*100)}%</div>`:''}
    <div class="legend"><span><i style="background:var(--cold)"></i>Sotto il riferimento</span><span><i style="background:var(--even)"></i>In linea</span><span><i style="background:var(--hot)"></i>Sopra il riferimento</span></div>
  </section>

  <section class="panel">
    <div class="row between"><h3>Andamento</h3><span class="legend"><span><i style="background:var(--accent)"></i>Dal campo</span><span><i style="background:var(--cold)"></i>Liberi</span></span></div>
    ${trendSvg(list)}
  </section>

  <section class="panel">
    <h3>Sessioni</h3>
    ${list.length ? `<div class="list">${list.slice().reverse().map(sessionRow).join('')}</div>` : `<p class="muted">Nessuna sessione nel periodo. Registra la prima dopo il prossimo allenamento.</p>`}

function sessionRow(s){
  const t = sumZones([s]); const [m,a] = totals(t, fieldF); const ft = t.tl;
  const confirming = S.confirmDel === s.id;
  return `<div class="item">
    <div class="date">${fmtShort(s.date)}</div>
    <div class="grow"><div><span class="num" style="font-size:18px;font-weight:600">${a?`${m}/${a} · ${pct(m,a)}%`:'—'}</span>${ft[1]?` <span class="muted">· TL ${ft[0]}/${ft[1]}</span>`:''}</div>${s.note?`<div class="note">${esc(s.note)}</div>`:''}</div>
    ${S.readOnly?'':`<button class="btn ${confirming?'danger':'ghost'} small" data-delshot="${esc(s.id)}">${confirming?'Conferma':'Elimina'}</button>`}
  </div>`;
}
function courtSvg(t){
  const B = [250,52.5];
  const zones = {
    acs:'M0 0 H250 V52.5 L0 140 Z', als:'M250 52.5 L0 140 V470 H81 Z', cen:'M250 52.5 L81 470 H419 Z',
    ald:'M250 52.5 L500 140 V470 H419 Z', acd:'M500 0 H250 V52.5 L500 140 Z'
  };
  const arc = 'M33.5 0 V99.3 A221.5 221.5 0 0 0 466.5 99.3 V0 Z';
  const z = id => `class="zone ${zoneClass(ZMAP[id], t[id])} ${S.zoneSel===id?'sel':''}" data-zone="${id}" role="button" tabindex="0" aria-label="${esc(ZMAP[id].name)}"`;
  const lbl = zz => { const ma = t[zz.id]; const p = pct(...ma);
    if (zz.small) return `<text x="${zz.lx}" y="${zz.ly}" class="pct" style="font-size:16px">${p==null?'—':p}</text>`;
    return `<text x="${zz.lx}" y="${zz.ly}" class="pct">${p==null?'—':p+'%'}</text><text x="${zz.lx}" y="${zz.ly+19}" class="ma">${ma[1]?ma[0]+'/'+ma[1]:'nessun tiro'}</text>`; };
  return `<svg class="court" viewBox="0 0 500 470" role="img" aria-label="Mappa di tiro sul mezzo campo">
    <defs><clipPath id="inArc"><path d="${arc}"/></clipPath></defs>
    <rect class="bg" x="0" y="0" width="500" height="470"/>
    ${['acs','als','cen','ald','acd'].map(id=>`<path d="${zones[id]}" ${z(id)}/>`).join('')}
    <g clip-path="url(#inArc)">
      <rect x="0" y="0" width="170" height="470" ${z('mls')}/>
      <rect x="170" y="190" width="160" height="280" ${z('mlc')}/>
      <rect x="330" y="0" width="170" height="470" ${z('mld')}/>
    </g>
    <rect x="170" y="0" width="160" height="190" ${z('pit')}/>
    <g class="lines">
      <rect x="1.25" y="1.25" width="497.5" height="467.5"/>
      <path d="M33.5 0 V99.3 A221.5 221.5 0 0 0 466.5 99.3 V0"/>
      <rect x="170" y="0" width="160" height="190"/>
      <path d="M190 190 A60 60 0 0 0 310 190"/>
      <path d="M190 190 A60 60 0 0 1 310 190" stroke-dasharray="9 8"/>
      <path d="M237.5 52.5 A12.5 12.5 0 0 0 262.5 52.5"/>
      <line x1="220" y1="40" x2="280" y2="40"/>
      <circle cx="${B[0]}" cy="${B[1]}" r="7.5"/>
      <path d="M190 470 A60 60 0 0 1 310 470"/>
    </g>
    ${ZONES.filter(zz=>zz.lx).map(lbl).join('')}
  </svg>`;
}
function trendSvg(list){
  const pts = list.map(s=>{ const t=sumZones([s]); const [m,a]=totals(t,fieldF); return {d:s.date, f:pct(m,a), ft:pct(...t.tl)}; }).filter(p=>p.f!=null||p.ft!=null).slice(-14);
  if (pts.length < 2) return `<p class="muted">Servono almeno due sessioni per vedere l'andamento.</p>`;
  const W=340,H=170,L=32,R=10,T=10,Bm=26, iw=W-L-R, ih=H-T-Bm;
  const x = i => L + (pts.length===1?iw/2:i*iw/(pts.length-1)); const y = v => T + ih - v/100*ih;
  const line = key => { let d=''; pts.forEach((p,i)=>{ if(p[key]==null) return; d += (d?'L':'M') + x(i).toFixed(1)+' '+y(p[key]).toFixed(1)+' '; }); return d; };
  const fIdx = pts.map((p,i)=>p.f!=null?i:-1).filter(i=>i>=0);
  const area = fIdx.length>1 ? `M${x(fIdx[0])} ${y(0)} ` + fIdx.map(i=>`L${x(i).toFixed(1)} ${y(pts[i].f).toFixed(1)}`).join(' ') + ` L${x(fIdx.at(-1))} ${y(0)} Z` : '';
  const last = pts.at(-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Percentuali per sessione">
    ${[0,25,50,75,100].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <path class="a-all" d="${area}"/>
    <path class="l-all" d="${line('f')}"/>
    <path class="l-ft" d="${line('ft')}"/>
    ${last.f!=null?`<circle class="d-all" cx="${x(pts.length-1)}" cy="${y(last.f)}" r="4.5"/>`:''}
    ${last.ft!=null?`<circle class="d-ft" cx="${x(pts.length-1)}" cy="${y(last.ft)}" r="4"/>`:''}
    <text class="axis" x="${L}" y="${H-6}">${fmtShort(pts[0].d)}</text>
    <text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(last.d)}</text>
  </svg>`;
}

// ---------- vista: piano ----------

  const p = S.players[S.pid]; const plan = planFor(S.pid); const items = plan.items||[];
  const wk = parseYmd(S.week); const end = addDays(wk,6);
  const done = checksFor(S.pid, S.week); const prog = weekProgress(S.pid, S.week);
  const todayIdx = S.week === ymd(monday(new Date())) ? (new Date().getDay()+6)%7 : -1;
  const cur = S.week === ymd(monday(new Date()));
  const staff = isStaff();
  return `

      <div class="ex">

          ${staff&&!S.readOnly?`<button class="btn ghost small" data-editex="${esc(it.id)}">Modifica</button>`:''}</div>

        ${it.detail?`<p class="detail">${esc(it.detail)}</p>`:''}
        ${it.video?`<a href="${esc(it.video)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;font-size:14px">Guarda il video ↗</a>`:''}
        <div class="days">${DAYS.map((d,i)=>{ const on=(it.days||[]).includes(i); const k=`${it.id}:${i}`; const dn=!!done[k];
          return `<div class="day ${i===todayIdx?'today':''}">${d}<button class="dot ${on?'on':'off'} ${dn?'done':''}" ${on&&!S.readOnly?`data-check="${esc(k)}"`:'disabled'} aria-label="${d}: ${on?(dn?'fatto':'da fare'):'riposo'}" aria-pressed="${dn}">${dn?'✓':''}</button></div>`; }).join('')}</div>
      </div>`).join('') : `<p class="muted">${staff?'Nessun esercizio assegnato. Parti dalla libreria con “Aggiungi esercizio”.':'Lo staff non ha ancora preparato il tuo piano.'}</p>`}
  </section>`;
}

// ---------- vista: squadra ----------
function viewSquadra(){
  const players = playersSorted(); const wk = ymd(monday(new Date()));
  const rows = players.map(p=>{
    const pr = weekProgress(p.id, wk); const pp = pr.tot ? Math.round(pr.ok/pr.tot*100) : null;
    const s7 = sumZones(sessionsFor(p.id,7)); const [,a7] = totals(s7, fieldF);
    const s30 = sumZones(sessionsFor(p.id,30)); const [tm,ta] = totals(s30, z=>z.three);
    const cls = pp==null?'p-low':pp>=75?'p-good':pp>=40?'p-mid':'p-low';
    const conf = S.confirmDel === 'pl_'+p.id;
    return `<tr class="click" data-goto="${esc(p.id)}">
      <td>${p.num!=null&&p.num!==''?'<span class="muted">#'+esc(p.num)+'</span> ':''}${esc(p.name)}<div class="muted" style="font-size:12px;font-weight:500">${esc(p.role||'')}</div></td>
      <td><span class="pill ${cls}">${pp==null?'—':pp+'%'}</span></td>
      <td>${a7 + s7.tl[1]}</td>
      <td>${s30.tl[1]?pct(...s30.tl)+'%':'—'}</td>
      <td>${ta?pct(tm,ta)+'%':'—'}</td>
      <td>${S.readOnly?'':`<button class="btn ${conf?'danger':'ghost'} small" data-delplayer="${esc(p.id)}">${conf?'Conferma':'Togli'}</button>`}</td>
    </tr>`;
  }).join('');
  return `
  <section class="panel">
    <div><div class="label">Questa settimana</div><h2>Quadro della squadra</h2></div>
    <p class="muted" style="margin:0;font-size:13.5px">Tocca un giocatore per aprire il suo diario. Il piano è la quota di esercizi spuntati sul totale assegnato.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Giocatore</th><th>Piano</th><th>Tiri 7g</th><th>TL 30g</th><th>3P 30g</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section>
  <section class="panel"><h3>Aggiungi un giocatore</h3>${playerForm()}</section>`;
}

// ---------- eventi ----------
function bindMain(){
  const m = $('#main');
  m.onclick = async e => {
    const t = e.target.closest('button,[data-zone],tr[data-goto]'); if (!t) return;
    if (t.dataset.period!=null){ S.period=+t.dataset.period; render(); }
    else if (t.dataset.zone){ S.zoneSel = S.zoneSel===t.dataset.zone?null:t.dataset.zone; render(); }
    else if (t.dataset.act==='log') openLog();
    else if (t.dataset.act==='addEx') openEx(null);
    else if (t.dataset.act==='note') openNote();
    else if (t.dataset.editex) openEx(t.dataset.editex);
    else if (t.dataset.week){ S.week = ymd(addDays(parseYmd(S.week), 7*+t.dataset.week)); render(); }
    else if (t.dataset.check) toggleCheck(t.dataset.check);
    else if (t.dataset.delshot){ const id=t.dataset.delshot; if (S.confirmDel===id){ S.confirmDel=null; await del('shots',id); toast('Sessione eliminata'); } else { S.confirmDel=id; render(); } }
    else if (t.dataset.delplayer){ e.stopPropagation(); const id=t.dataset.delplayer; if (S.confirmDel==='pl_'+id){ S.confirmDel=null; await del('players',id); toast('Giocatore tolto dalla rosa'); } else { S.confirmDel='pl_'+id; render(); } }
    else if (t.dataset.goto){ S.pid=t.dataset.goto; lsSet('fo.pid',S.pid); setTab('tiro'); }
  };
  m.onkeydown = e => { if ((e.key==='Enter'||e.key===' ') && e.target.dataset && e.target.dataset.zone){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); } };
  const f = $('#addPlayer');
  if (f) f.onsubmit = async e => {
    e.preventDefault(); const name = $('#np-name').value.trim(); if (!name) return;
    const num = $('#np-num').value.trim(); const id = S.demo||!db ? rid() : db.collection('players').doc().id;
    if (await put('players', id, {name, num, role:$('#np-role').value, ts:Date.now()})){ S.pid = S.pid && S.players[S.pid] ? S.pid : id; toast(`${name} aggiunto alla rosa`); }
  };
}
function setTab(k){ S.tab=k; S.confirmDel=null; lsSet('fo.tab',k); render(); window.scrollTo({top:0}); }
$('#tabs').onclick = e => { const b=e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); };
$('#pick').onchange = e => { S.pid=e.target.value; S.zoneSel=null; S.confirmDel=null; lsSet('fo.pid',S.pid); render(); };
$('#roleBtn').onclick = () => { S.asPlayer=!S.asPlayer; render(); };

async function toggleCheck(k){
  const key = `${S.pid}_${S.week}`; const cur = {...checksFor(S.pid, S.week)};
  if (cur[k]) delete cur[k]; else cur[k] = true;
  await put('checks', key, {pid:S.pid, week:S.week, done:cur, ts:Date.now()});
}

// ---------- fogli (modali) ----------
function openSheet(html, onMount){
  const host = $('#sheetHost');
  host.innerHTML = `<div class="sheet-back"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const back = host.firstElementChild;
  back.onclick = e => { if (e.target===back || e.target.closest('[data-close]')) closeSheet(); };
  document.addEventListener('keydown', escClose);
  onMount && onMount(host.querySelector('.sheet'));
  const first = host.querySelector('input,select,textarea'); first && first.focus({preventScroll:true});
}
function escClose(e){ if (e.key==='Escape') closeSheet(); }
function closeSheet(){ $('#sheetHost').innerHTML=''; document.removeEventListener('keydown', escClose); if (S.ready) render(); }

      <div class="step"><button type="button" data-st="a:${z.id}:-1" aria-label="Meno tentati">−</button><div><input id="a-${z.id}" inputmode="numeric" value="0" aria-label="Tentati ${esc(z.name)}"><div class="cap">Tentati</div></div><button type="button" data-st="a:${z.id}:1" aria-label="Più tentati">+</button></div>
    </div>`).join('');
  openSheet(`<form id="logForm" style="display:flex;flex-direction:column;gap:12px">
    <div class="row between"><div><div class="label">Nuova sessione</div><h2>${esc(p.name)}</h2></div><button type="button" class="btn ghost small" data-close>Chiudi</button></div>
    <div class="field"><label class="label" for="lg-date">Data</label><input type="date" id="lg-date" value="${ymd(new Date())}" max="${ymd(new Date())}" required></div>
    <p class="muted" style="margin:0;font-size:13.5px">Inserisci solo le zone in cui hai tirato. Il tasto + sui tentati aggiunge 5 alla volta.</p>
    <div>${rows}</div>
    <div class="field"><label class="label" for="lg-note">Nota (facoltativa)</label><textarea id="lg-note" maxlength="300" placeholder="Es. tiri dopo l'allenamento, gambe stanche"></textarea></div>
    <div class="err" id="lg-err" role="alert"></div>
    <button class="btn">Salva sessione</button></form>`, sh => {
      sh.onclick = e => { const b=e.target.closest('[data-st]'); if(!b) return; const [k,id,d]=b.dataset.st.split(':'); const inp=sh.querySelector(`#${k}-${id}`); const step = k==='a'?5:1; inp.value=Math.max(0,(parseInt(inp.value)||0)+(+d)*step); if(k==='m'){ const a=sh.querySelector('#a-'+id); if((+inp.value)>(+a.value)) a.value=inp.value; } };
      sh.querySelector('#logForm').onsubmit = async e => {
        e.preventDefault(); const z = {}; let bad=null, any=false;
        ZONES.forEach(zz=>{ const m=parseInt(sh.querySelector('#m-'+zz.id).value)||0, a=parseInt(sh.querySelector('#a-'+zz.id).value)||0; if(m>a) bad=zz.name; if(a>0){ z[zz.id]=[m,a]; any=true; } });
        const err = sh.querySelector('#lg-err');
        if (bad){ err.textContent = `${bad}: i canestri segnati non possono superare i tentativi.`; return; }
        if (!any){ err.textContent = 'Inserisci almeno una zona con dei tentativi.'; return; }
        const id = S.demo||!db ? rid() : db.collection('shots').doc().id;
        const ok = await put('shots', id, {pid:S.pid, date:sh.querySelector('#lg-date').value, z, note:sh.querySelector('#lg-note').value.trim(), by:S.uid, ts:Date.now()});
        if (ok){ closeSheet(); S.period = S.period||0; render(); toast('Sessione salvata'); }
      };
  });
}

function openEx(exId){
  const plan = planFor(S.pid); const it = exId ? (plan.items||[]).find(x=>x.id===exId) : null;
  const v = it || {title:'',cat:CATS[0],target:'',detail:'',video:'',days:[0,2,4]};
  openSheet(`<form id="exForm" style="display:flex;flex-direction:column;gap:12px">
    <div class="row between"><div><div class="label">${it?'Modifica esercizio':'Nuovo esercizio'}</div><h2>${esc(S.players[S.pid].name)}</h2></div><button type="button" class="btn ghost small" data-close>Chiudi</button></div>
    ${it?'':`<div class="field"><span class="label">Dalla libreria</span><div class="lib">${LIB.map((l,i)=>`<button type="button" data-lib="${i}">${esc(l.title)}</button>`).join('')}</div></div>`}
    <div class="field"><label class="label" for="ex-title">Esercizio</label><input id="ex-title" required maxlength="60" value="${esc(v.title)}"></div>
    <div class="grid2">
      <div class="field"><label class="label" for="ex-cat">Area</label><select id="ex-cat">${CATS.map(c=>`<option ${c===v.cat?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label class="label" for="ex-target">Volume</label><input id="ex-target" maxlength="40" placeholder="Es. 3 × 20" value="${esc(v.target)}"></div>
    </div>
    <div class="field"><label class="label" for="ex-detail">Come si fa</label><textarea id="ex-detail" maxlength="400">${esc(v.detail)}</textarea></div>
    <div class="field"><label class="label" for="ex-video">Link al video (facoltativo)</label><input id="ex-video" type="url" placeholder="https://…" value="${esc(v.video||'')}"></div>
    <div class="field"><span class="label">Giorni</span><div class="daypick">${DAYS.map((d,i)=>`<label><input type="checkbox" id="ex-d${i}" ${(v.days||[]).includes(i)?'checked':''}>${d}</label>`).join('')}</div></div>
    <div class="err" id="ex-err" role="alert"></div>
    <div class="row between"><button class="btn">${it?'Salva modifiche':'Aggiungi al piano'}</button>${it?'<button type="button" class="btn danger small" id="ex-del">Rimuovi</button>':''}</div>
  </form>`, sh => {
    sh.onclick = e => { const b=e.target.closest('[data-lib]'); if(!b) return; const l=LIB[+b.dataset.lib];
      sh.querySelector('#ex-title').value=l.title; sh.querySelector('#ex-cat').value=l.cat; sh.querySelector('#ex-target').value=l.target; sh.querySelector('#ex-detail').value=l.detail; };
    const delBtn = sh.querySelector('#ex-del');
    if (delBtn) delBtn.onclick = async () => {
      if (delBtn.dataset.c!=='1'){ delBtn.dataset.c='1'; delBtn.textContent='Conferma rimozione'; return; }
      const items = (plan.items||[]).filter(x=>x.id!==exId);
      if (await put('plans', S.pid, {...plan, items, ts:Date.now()})){ closeSheet(); toast('Esercizio rimosso'); }
    };
    sh.querySelector('#exForm').onsubmit = async e => {
      e.preventDefault();
      const days = DAYS.map((_,i)=>i).filter(i=>sh.querySelector('#ex-d'+i).checked);
      const video = sh.querySelector('#ex-video').value.trim();
      if (!days.length){ sh.querySelector('#ex-err').textContent='Scegli almeno un giorno.'; return; }
      if (video && !/^https:\/\//i.test(video)){ sh.querySelector('#ex-err').textContent='Il link deve iniziare con https://'; return; }
      const nx = {id: it?it.id:rid(), title:sh.querySelector('#ex-title').value.trim(), cat:sh.querySelector('#ex-cat').value, target:sh.querySelector('#ex-target').value.trim(), detail:sh.querySelector('#ex-detail').value.trim(), video, days};
      const items = it ? plan.items.map(x=>x.id===it.id?nx:x) : [...(plan.items||[]), nx];
      if (await put('plans', S.pid, {...plan, items, ts:Date.now()})){ closeSheet(); toast(it?'Esercizio aggiornato':'Esercizio aggiunto'); }
    };
  });
}
function openNote(){
  const plan = planFor(S.pid);
  openSheet(`<form id="noteForm" style="display:flex;flex-direction:column;gap:12px">
    <div class="row between"><div><div class="label">Nota dello staff</div><h2>${esc(S.players[S.pid].name)}</h2></div><button type="button" class="btn ghost small" data-close>Chiudi</button></div>
    <div class="field"><label class="label" for="nt">Obiettivo o indicazione per la settimana</label><textarea id="nt" maxlength="500" style="min-height:120px">${esc(plan.note||'')}</textarea></div>
    <button class="btn">Salva nota</button></form>`, sh => {
    sh.querySelector('#noteForm').onsubmit = async e => { e.preventDefault();
      if (await put('plans', S.pid, {items:[], ...plan, note:sh.querySelector('#nt').value.trim(), ts:Date.now()})){ closeSheet(); toast('Nota salvata'); } };
  });
}

// ---------- dati di esempio (solo quando il salvataggio non è disponibile) ----------
function loadDemo(){
  S.demo = true; S.staff = true; S.ready = true;
  let seed = 7; const rnd = () => { seed = (seed*16807)%2147483647; return seed/2147483647; };
  const ps = [['Luca B.',4,'Playmaker'],['Matteo F.',7,'Guardia'],['Davide C.',11,'Ala'],['Samuele G.',15,'Centro']];
  const today = new Date(); const wk = ymd(monday(today));
  ps.forEach(([name,num,role],pi)=>{
    const id = 'demo'+pi; S.players[id] = {name, num:String(num), role, ts:pi};
    for (let k=0;k<11;k++){
      const date = ymd(addDays(today, -k*3 - (pi%2)));
      const lvl = 0.9 + (10-k)*0.012; const z = {};
      ZONES.forEach(zz=>{ const big = zz.id==='tl' ? 20 : (role==='Centro' ? (zz.three?2:12) : (zz.three?10:6));
        const a = Math.max(0, Math.round(big*(0.6+rnd()*0.8))); if (!a) return;
        const m = Math.min(a, Math.round(a*zz.ref*lvl*(0.75+rnd()*0.5))); z[zz.id]=[m,a]; });
      S.shots[`d${pi}_${k}`] = {pid:id, date, z, note: k===0 && pi===0 ? 'Dopo allenamento, 20 minuti extra' : '', ts:k};
    }
    const pick = role==='Centro' ? [4,5,6,3] : role==='Playmaker' ? [0,1,3,8] : [1,2,6,7];
    S.plans[id] = {note: pi===0 ? 'Obiettivo di dicembre: 75% ai liberi. Stessa routine, ogni tiro.' : '', items: pick.map((li,j)=>({id:'e'+j, ...LIB[li], video:'', days: j%2? [1,3,5] : [0,2,4]}))};
    const done = {}; const upto = (today.getDay()+6)%7;
    S.plans[id].items.forEach(it=>it.days.forEach(d=>{ if (d<=upto && rnd() < 0.75 - pi*0.12) done[`${it.id}:${d}`]=true; }));
    S.checks[`${id}_${wk}`] = {pid:id, week:wk, done};
  });
  if (!S.players[S.pid]) S.pid = 'demo0';
  render();
}

// ---------- avvio ----------
async function start(){
  render();
  const C = window.claude;
  if (!C || typeof C.use !== 'function'){ loadDemo(); return; }
  const [d, user] = await Promise.all([C.use('db').catch(()=>null), C.use('user').catch(()=>null)]);
  if (!d){ loadDemo(); return; }
  db = d;
  S.staff = user ? await user.isOwner() : false;
  S.uid = user ? await user.id() : null;
  const can = user ? await user.can('data.write') : null;
  if (can === false) S.readOnly = true;
  const got = new Set();
  ['players','shots','plans','checks'].forEach(coll=>{
    db.collection(coll).onSnapshot(snap=>{
      const o = {}; snap.docs.forEach(doc=>{ o[doc.id] = doc.data(); }); S[coll] = o;
      got.add(coll); if (got.size===4) S.ready = true;
      if (S.ready && !document.querySelector('.sheet')) render(); else if (S.ready) { renderHeader(); }
    }, err=>{ toast('Collegamento ai dati interrotto. Ricarica la pagina.'); });
  });
}
start();
})();
</script>
