name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-web:
    name: Android + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: >
          ./gradlew
          :composeApp:ktlintCheck
          :composeApp:testDebugUnitTest
          :composeApp:assembleDebug
          :composeApp:wasmJsBrowserDistribution
          :composeApp:wasmJsBrowserTest
      # The log only says "Error": the messages are in the XML results.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-test-results
          path: composeApp/build/test-results/

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 :composeApp:iosSimulatorArm64Test

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase test db

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - run: deno test --allow-read --allow-env --allow-net supabase/functions/import-league/parse_test.ts
      - name: Functions fit the deploy limit
        # shortcut: measures the dependencies downloaded, not the bundle Supabase builds (npm pdfjs-dist, refused
        # with 413, was 64 MB here; esm.sh 2 MB). Use the real bundler if a function lands near the limit.
        run: |
          export DENO_DIR="$RUNNER_TEMP/deno-size"
          for f in supabase/functions/*/index.ts; do
            rm -rf "$DENO_DIR"
            deno cache --quiet "$f"
            kb=$(du -sk "$DENO_DIR" | cut -f1)
            echo "$f: $kb kB"
            [ "$kb" -le 20480 ] || { echo "::error::$f pulls $kb kB, over Supabase's 20 MB per function"; exit 1; }
          done
